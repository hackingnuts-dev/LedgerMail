name: LedgerMail PWA static checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/strict.js && node web/strict.test.mjs && node --check web/engine.js && node --check web/store.js && node web/engine.test.mjs && node web/store.test.mjs && node --check web/app.js && node --check web/sw.js
      - run: node web/tests.mjs
      - run: npm install --no-save --no-audit --no-fund jsdom@26 fake-indexeddb@6 && node web/ui.test.mjs && node web/sync.test.mjs
