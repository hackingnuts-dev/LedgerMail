name: Validate LedgerMail
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'netlify.toml'
      - '.github/workflows/netlify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout LedgerMail
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app source and contracts
        run: |
          node --check web/strict.js
          node web/strict.test.mjs
          node --check web/engine.js
          node --check web/store.js
          node web/engine.test.mjs
          node web/store.test.mjs
          node --check web/quota.js
          node web/quota.test.mjs
          node --check web/app.js
          node --check web/sw.js
          node web/sw.test.mjs
          node web/tests.mjs
          npm install --no-save --no-audit --no-fund jsdom@26 fake-indexeddb@6
          node web/ui.test.mjs
          node web/sync.test.mjs
      - name: Generate iPhone Home Screen and PWA PNG icons
        run: node generate-icons.mjs
